name: Tests

on:
  push:
    branches: [ Main, develop ]
  pull_request:
    branches: [ Main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Test ingestion pipeline
      run: |
        python -c "from ingest import build_bm25_index; print('✓ Ingest module loads successfully')"
    
    - name: Test retrieval module
      run: |
        python -c "from retrieve import QueryParser; print('✓ Retrieve module loads successfully')"
    
    - name: Test query module
      run: |
        python -c "from query import RAGQuery; print('✓ Query module loads successfully')"
