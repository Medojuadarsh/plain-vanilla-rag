name: Linting

on:
  push:
    branches: [ Main, develop ]
  pull_request:
    branches: [ Main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: Run Black formatter check
      run: black --check . --exclude="__pycache__|\.git|venv" || true
    
    - name: Run isort import sorter check
      run: isort --check-only . --exclude="__pycache__|\.git|venv" || true
    
    - name: Run flake8 linter
      run: flake8 . --max-line-length=100 --exclude="__pycache__,venv,\.git" --count --statistics
      continue-on-error: true
